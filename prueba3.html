<html>

<head>
    <script>
        function promediar() {
            let numero1 = parseInt(document.getElementById("numero1").value);
            let numero2 = parseInt(document.getElementById("numero2").value);
            let numero3 = parseInt(document.getElementById("numero3").value);
            let promedio = (numero1 + numero2 + numero3) / 3;

            document.getElementById("resultado").innerHTML = "el promedio es:" + promedio;
        }
    </script>
    <style>
        #resultado {
            font-size: 20px;
            color: blue;
        }
    </style>
</head>

<body>
    Numero 1:<input type="text" id="numero1">
    <br><br>
    Numero 2:<input type="text" id="numero2">
    <br><br>
    Numero 3:<input type="text" id="numero3">
    <br><br>
    <button type="button" onclick="promediar()">Promediar</button>
    <br><br>
    <div id="resultado"></div>
</body>

</html>
