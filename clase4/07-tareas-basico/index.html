<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas - version basica</title>

    <!--
        ==========================================================
        VERSION BASICA DEL PROYECTO
        ==========================================================
        Dos archivos nada mas:
            index.html  -> el HTML y el CSS (aca)
            app.js      -> todo el JavaScript

        Sin librerias externas: funciona sin internet.

        Es el primer paso. Despues de que esto ande, pasamos a
        la carpeta 05-proyecto/, donde el CSS tambien se separa
        y se le suman las librerias.
        ==========================================================
    -->

    <style>
        /* ---------- Base ---------- */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #eceff1;
            color: #263238;
            margin: 0;
            padding: 30px 16px;
        }

        .contenedor {
            background-color: white;
            max-width: 500px;
            margin: 0 auto;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .15);
        }

        h1 {
            margin: 0 0 20px;
            font-size: 24px;
            color: #37474f;
        }

        /* ---------- Alta de tarea ---------- */
        .alta {
            display: flex;
            gap: 8px;
        }

        .alta input {
            flex: 1;
            padding: 10px;
            font-size: 15px;
            border: 1px solid #b0bec5;
            border-radius: 4px;
            font-family: inherit;
        }

        button {
            padding: 10px 16px;
            font-size: 14px;
            font-family: inherit;
            border: none;
            border-radius: 4px;
            background-color: #1976d2;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #1565c0;
        }

        /* ---------- Mensaje de error ---------- */
        /* Arranca escondido. El JavaScript le saca la clase "oculto" */
        .aviso {
            color: #c62828;
            background-color: #ffebee;
            border-left: 3px solid #c62828;
            padding: 8px 12px;
            margin: 12px 0 0;
            font-size: 14px;
        }

        /* ---------- Lista ---------- */
        .lista {
            list-style: none;
            padding: 0;
            margin: 20px 0 0;
        }

        .lista li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 4px;
            border-bottom: 1px solid #eceff1;
        }

        /* El texto ocupa todo el espacio libre y se puede clickear */
        .lista li .texto {
            flex: 1;
            cursor: pointer;
        }

        /* ESTA es la clase clave del proyecto.
           El JavaScript la pone y la saca con classList.toggle */
        .lista li.completada .texto {
            text-decoration: line-through;
            color: #b0bec5;
        }

        .btn-borrar {
            background-color: #e53935;
            padding: 5px 10px;
            font-size: 13px;
        }

        .btn-borrar:hover {
            background-color: #c62828;
        }

        /* ---------- Pie ---------- */
        .pie {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            padding-top: 15px;
            border-top: 2px solid #eceff1;
            font-size: 14px;
            color: #546e7a;
        }

        .pie button {
            background-color: #90a4ae;
        }

        .pie button:hover {
            background-color: #78909c;
        }

        /* Clase de uso general para esconder cosas desde el JavaScript */
        .oculto {
            display: none;
        }
    </style>

    <!--
        El JavaScript va aparte, y con defer:
        asi se ejecuta recien cuando el HTML termino de cargar.
    -->
    <script src="app.js" defer></script>
</head>

<body>

    <!-- El HTML solo describe QUE hay. Ni un onclick. -->
    <div class="contenedor">

        <h1>Mis Tareas</h1>

        <div class="alta">
            <input type="text" id="campo-tarea" placeholder="Que tengo que hacer?" autocomplete="off">
            <button id="btn-agregar">Agregar</button>
        </div>

        <p class="aviso oculto" id="aviso">Escribi la tarea antes de agregarla</p>

        <ul class="lista" id="lista-tareas"></ul>

        <div class="pie">
            <span id="contador">0 pendientes</span>
            <button id="btn-limpiar">Borrar completadas</button>
        </div>

    </div>

</body>

</html>
