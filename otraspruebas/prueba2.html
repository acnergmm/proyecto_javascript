<html>

<head>
    <script>
        var estado = true;
       
        function intercalarImagen() {
            estado = !estado;
            if (estado == true) {
                img.src = "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=100&h=150&fit=crop";
            } else if (estado == false) {
                img.src = "https://images.unsplash.com/photo-1552053831-71594a27632d?w=100&h=150&fit=crop";
            }

            setTimeout(intercalarImagen, 1000);
        }
        // o utilizamos setInterval(intercalarImagen, 1000);
    </script>
</head>

<body>
    
        <h2>Imagenes que cambian solas</h2>
        <br><br>
        <img name="img" src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=100&h=150&fit=crop" width="100" height="150">
        
        <button onclick="intercalarImagen()">empezar a cambiar </button>
</body>

</html>
