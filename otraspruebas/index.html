<html>
<title>Validacion de Datos - Rango de numeros</title>

<head>
	<script language="JavaScript">
		function traerPrimerNumero() {
			var num = parseInt(document.miformulario.primer_numero.value);
			//alert(num);
			if (Number.isNaN(num)) {
				document.querySelector(".error").innerHTML = "Por favor ingrese un valor entero";
			} else {
				if (num >= 1 && num <= 30) {
				
					document.querySelector(".error").innerHTML = "es menor o igual a 30 y mayor o igual a 1";
				}
				else {
					document.querySelector(".error").innerHTML = "no muy mayor a 30";

				}
			}
		}

	</script>
	<style>
		.error {
			color: red;
			font-size: 20px;
			background-color: #f2dede;
		}
	</style>
</head>

<body>
	<center>
		<h2>Validacion de Datos - Rango de numeros</h2>
	</center><br><br>
	<div class="error">
aca va a aparecer el mensaje de error
	</div>
	<form name="miformulario" type="post">
		ingrese primer numero :<input type="text" name="primer_numero">
		<br><br>

		
		<input type="button" value="Ver" onClick="traerPrimerNumero() ">
	</form>
</body>

</html>
