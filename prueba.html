<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script language="JavaScript">

        function cambiarFoto(variable_valor) {
            if (variable_valor == 1) {
                img.src = "https://images.unsplash.com/photo-1518791841217-8f162f1e1131?w=100&h=150&fit=crop";
            }
            else if (variable_valor == 2) {
                img.src = "https://images.unsplash.com/photo-1552053831-71594a27632d?w=100&h=150&fit=crop";
            }
        }

        function cambiarBackgroud() {
            document.getElementById("calculo").style.backgroundColor = "yellow";
        }

        function calcular() {
            var primer_numero = parseInt(document.getElementById("primer_numero").value);
            var segundo_numero = parseInt(document.getElementById("segundo_numero").value);
            var calculo = primer_numero + segundo_numero;
            document.getElementById("calculo").value = calculo;
        }   

        function loguear(valor) {
            console.log("El valor ingresado es: " + valor);
        }
    </script>
    <style>
        .centrar {
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="centrar">
        <h2>Imagen que cambia cuando entra y sale el mouse </h2>
    </div>
    <br><br>
    <div class="centrar" on>
        <img 
        name="img" 
        src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=100&h=150&fit=crop"
        onMouseOver="cambiarFoto(2)" 
        onMouseOut="cambiarFoto(1)" 
        width="100" 
        height="150"
        >
        <br><br>
        primer numero:<input type="text" name="primer_numero" id="primer_numero" >
        <br><br>
        segundo numero:<input type="text" name="segundo_numero" id="segundo_numero" >
        <!--ejemplo de onchange-->
        on change <input type="text" name="resultado" id="resultado" onkeyup="loguear(this.value)">
        

<br><br>
        resultado:<input type="text" name="calculo" id="calculo" onfocus="cambiarBackgroud(); calcular()">
    </div>
</body>
